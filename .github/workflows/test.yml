name: CI RSpec Test

on: [push, pull_request]

jobs:
  build:
    name: >-
      Ruby ${{ matrix.ruby }} - Mongoid ${{ matrix.mongoid }} - Mongo ${{ matrix.mongodb }}
    env:
      CI: true
      TESTOPTS: -v
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        ruby: [2.7, 3.0, 3.1, 3.2, 3.3, 3.4]
        mongoid: [7, 8, 9]
        mongodb: [7, 8]
        experimental: [false]
        include:
          - ruby: 2.3
            mongoid: 3
            experimental: false
            mongodb: 4.4
          - ruby: 2.4
            mongoid: 4
            experimental: false
            mongodb: 4.4
          - ruby: 2.5
            mongoid: 5
            experimental: false
            mongodb: 4.4
          - ruby: 2.6
            mongoid: 6
            experimental: false
            mongodb: 4.4
          - ruby: head
            mongoid: head
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb }}
          mongodb-replica-set: rs0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run:  bundle install --jobs 4 --retry 3
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
      - name: Test
        timeout-minutes: 10
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.experimental }}
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
