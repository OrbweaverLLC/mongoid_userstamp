name: CI RSpec Test

on: [push, pull_request]

jobs:
  build:
    name: >-
      Ruby ${{ matrix.ruby }} - Mongoid ${{ matrix.mongoid }} - Mongo ${{ matrix.mongodb }}
    env:
      CI: true
      TESTOPTS: -v
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest]
        rails: ["latest"]
        ruby: [ "3.3"]
        #        ruby: ["2.5", "2.6", "2.7", "3.0", "3.1", "3.2", "3.3"]
        mongoid: ["latest"]
        mongodb: [5]
        experimental: [false]
        include:
          - ruby: 2.2
            rails: latest
            mongoid: latest
            experimental: false
            os: ubuntu-22.04
          - ruby: 2.3
            rails: latest
            mongoid: latest
            experimental: false
            os: ubuntu-22.04
          - ruby: 2.4
            rails: latest
            mongoid: latest
            experimental: false
            os: ubuntu-22.04
#          - ruby: 2.5
#            rails: "5.0"
#            mongoid: "6.0"
#            experimental: false
#          - ruby: 2.6
#            rails: "5.0"
#            mongoid: "6.0"
#            experimental: false

#          - ruby: 2.1
#            mongoid: 3
#            experimental: false
#          - ruby: 2.2
#            mongoid: 3
#            experimental: false
#            mongodb: 4.4
#          - ruby: 2.3
#            mongoid: 3
#            experimental: false
#            mongodb: 4.4
#          - ruby: 2.4
#            mongoid: 4
#            experimental: false
#            mongodb: 4.4
#          - ruby: 2.5
#            mongoid: 5
#            experimental: false
#            mongodb: 4.4
#          - ruby: 2.6
#            mongoid: 6
#            experimental: false
#            mongodb: 4.4
#          - ruby: head
#            mongoid: head
#            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb }}
          mongodb-replica-set: rs0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
          RAILS_VERSION: ${{ matrix.rails }}
      - name: Test
        timeout-minutes: 10
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.experimental }}
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
          RAILS_VERSION: ${{ matrix.rails }}
